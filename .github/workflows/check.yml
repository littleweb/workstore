name: Checks
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/prepare-excalidraw.mjs
      - run: npm run release:check
      # The local formal entry runs frontend/Rust regressions, TypeScript,
      # module/resource budgets, macOS signing and DMG integrity checks.
      # It does not require publishing credentials or upload releases.
      - run: npm run desktop:build
